name: una_social
description: "Una Social, a fictional social network built with the una Flutter package."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  # una is not on pub.dev. CI and the Pages build take it from main;
  # for local work against a checkout, see pubspec_overrides.yaml in the
  # README.
  una:
    git:
      url: https://github.com/vlidholt/una.git
      ref: main
  flutter_solidart: ^2.1.0
  google_fonts: ^8.2.1
  disco: ^1.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    # Photographs from Unsplash; see assets/images/README.md.
    - assets/images/
