name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/deploy-pages.yaml"
  workflow_dispatch:

# Cancel an in-flight deploy when a newer one starts. Leaving the old job
# running can wedge the Pages queue (deployment_queued until timeout).
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: "stable"
          cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # Ensures the repo is on the GitHub Actions Pages deployment path.
          enablement: true

      - name: Build the app for the web
        run: |
          flutter pub get
          flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/"

      # Flutter ships debug symbol sidecars alongside the wasm/js bundles.
      # They are not served to browsers and only inflate the Pages artifact.
      - name: Strip build debug symbols
        run: find build/web -name '*.symbols' -delete

      - name: Report artifact size
        run: du -sh build/web && du -sh build/web/* | sort -hr | head -10

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # Pages occasionally leaves a deploy in deployment_queued; try once
      # more before failing. The action hard-caps polling at 10 minutes.
      # Not a retry wrapper action: Wandalen/wretry.action passes the whole
      # event to node on the command line, and a push with a few hundred
      # commits fails with "Argument list too long" before deploying.
      - name: Deploy to GitHub Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Wait before retrying
        if: steps.first.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
